<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>고객 노트 · J Harness 데모</title><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script></head>
<body><header><a class="brand" href="/">고객 노트<span>LOCAL WORKSPACE</span></a><span class="badge">J Harness 개발 데모</span></header>
<main><section class="intro"><p class="eyebrow">작은 관계를, 오래 이어가세요</p><h1>고객의 다음 이야기를<br>한곳에 기록하세요.</h1><p>이름과 연락처, 잊지 말아야 할 메모까지.<br>이 컴퓨터에서만 사용하는 가벼운 고객 관리 공간입니다.</p></section>
<div class="workspace"><section class="panel editor"><div class="panel-title"><span class="number">01</span><h2 id="form-title">새 고객 추가</h2></div><form id="customer-form"><label>이름<input name="name" required maxlength="80" autocomplete="name" placeholder="고객 이름"></label><label>이메일<input name="email" type="email" required maxlength="200" autocomplete="email" placeholder="name@example.com"></label><label>메모<textarea name="note" maxlength="1000" rows="4" placeholder="관심사, 최근 대화, 다음 연락 계획"></textarea></label><div class="actions"><button type="submit" id="save">고객 저장</button><button type="button" class="secondary" id="cancel" hidden>수정 취소</button></div></form><p class="hint">합성 데이터로 체험해 주세요. 공개 서비스용 인증은 포함하지 않았습니다.</p></section>
<section class="panel list"><div class="panel-title"><span class="number">02</span><h2>고객 목록</h2><span id="count">0명</span></div><label class="search-label">고객 찾기<input id="search" type="search" placeholder="이름·이메일·메모 검색"></label><p id="message" role="status" aria-live="polite"></p><div id="customers"></div></section></div>
<footer>자료는 서버의 data/customers.json에 저장됩니다. · 로컬 주소만 열어 사용하세요.</footer></main></body></html>
