name: Alpha.2 draft ZIP upload recovery
on:
  push:
    branches: [ops/alpha2-upload-recovery-20261109]
permissions:
  contents: write
jobs:
  upload-reviewed-draft:
    if: github.repository == 'hacker943410-debug/ai-harness' && github.ref == 'refs/heads/ops/alpha2-upload-recovery-20261109'
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: d41dc007c70f6c4d655b6efa4f7e551cd383cd88
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
      - name: Build exact tagged product and attach ZIP to existing private draft
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $ProgressPreference='SilentlyContinue'
          $repo='hacker943410-debug/ai-harness'
          $tag='v8.0.0-alpha.2'
          $revision='d41dc007c70f6c4d655b6efa4f7e551cd383cd88'
          if((git rev-parse HEAD) -ne $revision){throw 'UNREVIEWED_SOURCE_REFUSED'}
          $release=gh api "repos/$repo/releases/438737734" | ConvertFrom-Json
          if($LASTEXITCODE -ne 0 -or $release.tag_name -ne $tag -or $release.draft -ne $true -or $release.prerelease -ne $true){throw 'EXACT_PRIVATE_ALPHA2_DRAFT_REQUIRED'}
          $remoteTag=gh api "repos/$repo/git/ref/tags/$tag" | ConvertFrom-Json
          if($remoteTag.object.type -eq 'tag'){$remoteTag=gh api "repos/$repo/git/tags/$($remoteTag.object.sha)" | ConvertFrom-Json}
          if($LASTEXITCODE -ne 0 -or $remoteTag.object.sha -ne $revision){throw 'RELEASE_TAG_MISMATCH'}
          $lab=Join-Path $env:RUNNER_TEMP 'alpha2-reviewed-upload'
          New-Item -ItemType Directory -Path $lab -ErrorAction Stop | Out-Null
          $sourceZip=Join-Path $lab 'source.zip'
          git archive --format=zip -o $sourceZip $revision
          if($LASTEXITCODE -ne 0){throw 'SOURCE_ARCHIVE_FAILED'}
          $source=Join-Path $lab 'source'
          Expand-Archive -LiteralPath $sourceZip -DestinationPath $source
          $node=Join-Path $lab 'node.exe'
          Invoke-WebRequest 'https://nodejs.org/dist/v22.22.2/win-x64/node.exe' -OutFile $node
          if((Get-FileHash -LiteralPath $node).Hash.ToLowerInvariant() -ne 'ae1a50511be58e987483fdbc12125407443926d2d394669ade2352776e920dd3'){throw 'NODE_SHA_MISMATCH'}
          $package=Join-Path $lab 'package'
          node (Join-Path $source 'core/build-integrated-product.mjs') --out $package --node-binary $node
          if($LASTEXITCODE -ne 0){throw 'PRODUCT_BUILD_FAILED'}
          $assets=Join-Path $lab 'assets'
          New-Item -ItemType Directory -Path $assets | Out-Null
          gh release download $tag --repo $repo --pattern JHarness-Install-Alpha.ps1 --pattern RELEASE_PROVENANCE.json --pattern VALIDATION.json --dir $assets
          if($LASTEXITCODE -ne 0){throw 'REVIEWED_METADATA_DOWNLOAD_FAILED'}
          if((Get-FileHash (Join-Path $assets 'JHarness-Install-Alpha.ps1')).Hash.ToLowerInvariant() -ne '643ea147b8319c084e03956dc92f7b6194091de8f01068aea5c36d05af5ddece'){throw 'CLI_ASSET_CHANGED'}
          if((Get-FileHash (Join-Path $assets 'RELEASE_PROVENANCE.json')).Hash.ToLowerInvariant() -ne '28a5aa592daba96081b4aa7baf0c1062e429795f8e29f4ed622bbc79825e7292'){throw 'PROVENANCE_ASSET_CHANGED'}
          if((Get-FileHash (Join-Path $assets 'VALIDATION.json')).Hash.ToLowerInvariant() -ne '203ff3e8649cc6e1cdc55800afca745d133a21d1fe93a20fcf5e2f72bd532bff'){throw 'VALIDATION_ASSET_CHANGED'}
          Copy-Item -LiteralPath (Join-Path $assets 'RELEASE_PROVENANCE.json') -Destination (Join-Path $package 'RELEASE_PROVENANCE.json')
          Copy-Item -LiteralPath (Join-Path $source 'docs/releases/v8.0.0-alpha.2.md') -Destination (Join-Path $package 'RELEASE_NOTES_KO.md')
          $env:JH_RECOVERY_PACKAGE=$package
          node --input-type=module -e "import fs from 'node:fs';import path from 'node:path';import {treeFiles,json} from './core/lib/io.mjs';const root=process.env.JH_RECOVERY_PACKAGE;const file=path.join(root,'SHA256_MANIFEST.json');const m=JSON.parse(fs.readFileSync(file,'utf8'));m.publicRelease='v8.0.0-alpha.2';m.files=treeFiles(root,new Set(['SHA256_MANIFEST.json']));fs.writeFileSync(file,json(m));"
          if($LASTEXITCODE -ne 0){throw 'MANIFEST_REFRESH_FAILED'}
          $zip=Join-Path $assets 'J_Harness_v8.0.0-alpha.2_Windows_x64.zip'
          Compress-Archive -Path (Join-Path $package '*') -DestinationPath $zip -CompressionLevel Optimal
          $rows=Get-ChildItem -LiteralPath $assets -File | Sort-Object Name | ForEach-Object {((Get-FileHash -LiteralPath $_.FullName).Hash.ToLowerInvariant()+'  '+$_.Name)}
          [IO.File]::WriteAllText((Join-Path $assets 'SHA256SUMS.txt'),(($rows -join "`n")+"`n"),[Text.Encoding]::ASCII)
          $latest=gh api "repos/$repo/releases/438737734" | ConvertFrom-Json
          if($LASTEXITCODE -ne 0 -or $latest.draft -ne $true -or $latest.tag_name -ne $tag){throw 'DRAFT_CHANGED_BEFORE_UPLOAD'}
          gh release upload $tag $zip (Join-Path $assets 'SHA256SUMS.txt') --repo $repo --clobber
          if($LASTEXITCODE -ne 0){throw 'DRAFT_UPLOAD_FAILED'}
          [ordered]@{result='ALPHA2_DRAFT_ZIP_UPLOADED';release=$tag;source=$revision;zipSha256=(Get-FileHash -LiteralPath $zip).Hash.ToLowerInvariant();published=$false;credentialsCopied=$false} | ConvertTo-Json
