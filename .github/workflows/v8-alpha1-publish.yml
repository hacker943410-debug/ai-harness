name: Finalize verified J Harness v8.0.0-alpha.1 draft
on:
  push:
    branches: [feature/v8-integrated-installer-first-use]
    paths: ['.github/workflows/v8-alpha1-publish.yml']
permissions: {}
jobs:
  publish-existing-draft-only:
    if: >-
      github.repository == 'hacker943410-debug/ai-harness' &&
      github.actor == 'hacker943410-debug' &&
      github.ref == 'refs/heads/feature/v8-integrated-installer-first-use'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: hacker943410-debug/ai-harness
      RELEASE_ID: '438646193'
      TAG: v8.0.0-alpha.1
      SOURCE_SHA: ce9f36c9fe46e15197e967d84a752d0dcbff989c
    steps:
      - name: Verify exact draft release, immutable source, asset digests, and successful CI
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$REPO/releases/$RELEASE_ID" > release.json
          test "$(jq -r .tag_name release.json)" = "$TAG"
          test "$(jq -r .draft release.json)" = "true"
          test "$(jq -r .prerelease release.json)" = "true"
          test "$(jq -r .target_commitish release.json)" = "$SOURCE_SHA"
          test "$(jq -r '.assets|length' release.json)" = "3"
          test "$(jq -r '.assets[]|select(.name=="J_Harness_v8.0.0-alpha.1_Windows_x64.zip")|.digest' release.json)" = "sha256:213bc7d292be9a6f56cf77b08f5011adb5ef7ee042f7b78871c567119ce9a855"
          test "$(jq -r '.assets[]|select(.name=="JHarness-Install-Alpha.ps1")|.digest' release.json)" = "sha256:28273c2bdae72344dee5ebf9c07f4ec698a408e6f4d9d9f718a5f99d20847598"
          test "$(jq -r '.assets[]|select(.name=="SHA256SUMS.txt")|.digest' release.json)" = "sha256:f1a91b7d829ad8b01db39ef795d9e7ce794fe202858b40baaf4edd87aa491d78"
          test "$(gh api "repos/$REPO/actions/runs/42206534550" --jq .conclusion)" = "success"
          if gh api "repos/$REPO/git/ref/tags/$TAG" >/dev/null 2>&1; then
            echo 'Unexpected existing tag; refusing draft publication'
            exit 1
          fi
          echo 'MATCHED_EXPECTED_DRAFT_AND_THREE_SIGNED_DIGEST_FIELDS'
      - name: Publish GitHub Pre-release only after all checks
        shell: bash
        run: |
          set -euo pipefail
          gh api --method PATCH "repos/$REPO/releases/$RELEASE_ID" -F draft=false -F prerelease=true > published.json
          test "$(jq -r .draft published.json)" = "false"
          test "$(jq -r .prerelease published.json)" = "true"
          test "$(jq -r .tag_name published.json)" = "$TAG"
          test "$(gh api "repos/$REPO/releases/tags/$TAG" --jq .draft)" = "false"
          test "$(gh api "repos/$REPO/releases/tags/$TAG" --jq .prerelease)" = "true"
          test "$(gh api "repos/$REPO/releases/tags/$TAG" --jq '.assets|length')" = "3"
          echo "ALPHA_PRERELEASE_PUBLISHED=https://github.com/$REPO/releases/tag/$TAG"
