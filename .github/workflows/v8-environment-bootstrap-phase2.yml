name: J Harness v8 Phase2 Portable Windows Installer Candidate
on:
  push:
    branches: [feature/v8-environment-bootstrap-phase2]
  pull_request:
    branches: [feature/v8-environment-bootstrap-phase1]
permissions:
  contents: read
jobs:
  environment-contract:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test core/tests/environment.test.mjs
      - run: node --check core/build-windows-bootstrap.mjs
      - run: node --check core/environment/doctor.mjs
  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
      - name: Build unsigned Windows package with pinned official Node binary
        shell: pwsh
        run: |
          # GitHub actions/node-versions may repackage node.exe: never trust it as the official pinned artifact.
          $nodePath=Join-Path $env:RUNNER_TEMP 'official-node-v22.22.2.exe'
          $expected='ae1a50511be58e987483fdbc12125407443926d2d394669ade2352776e920dd3'
          Invoke-WebRequest -Uri 'https://nodejs.org/dist/v22.22.2/win-x64/node.exe' -OutFile $nodePath -MaximumRedirection 0
          if ((Get-FileHash -LiteralPath $nodePath -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) { throw 'Downloaded official Node exe failed pinned SHA256' }
          node core/build-windows-bootstrap.mjs --out "$env:RUNNER_TEMP\jh-phase2-dist" --node-binary "$nodePath"
      - name: End-to-end isolated install, doctor, preserve, uninstall
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $package=Join-Path $env:RUNNER_TEMP 'jh-phase2-dist'
          $bootstrap=Join-Path $package 'bootstrap\Bootstrap-JHarness.ps1'
          $remove=Join-Path $package 'bootstrap\Uninstall-JHarness.ps1'
          $scratch=Join-Path $env:RUNNER_TEMP 'jh-phase2-fixture'
          $testCodexHome=Join-Path $scratch 'codex-home'
          $runtime=Join-Path $scratch 'managed'
          $fakeBin=Join-Path $scratch 'bin'
          New-Item -ItemType Directory -Force -Path $testCodexHome,$fakeBin | Out-Null
          $fake=Join-Path $fakeBin 'node_modules\@openai\codex\bin'
          New-Item -ItemType Directory -Force -Path $fake | Out-Null
          Set-Content -LiteralPath (Join-Path $fake 'codex.js') -Value "console.log('codex-cli 0.166.0 fake-for-CI-only')" -Encoding UTF8
          Set-Content -LiteralPath (Join-Path $fakeBin 'codex.cmd') -Value ('@echo off'+[Environment]::NewLine+'echo codex-cli fake-for-CI-only') -Encoding ASCII
          $env:PATH=$fakeBin+';'+$env:PATH
          $env:CODEX_HOME=$testCodexHome
          Set-Content -LiteralPath (Join-Path $testCodexHome 'AGENTS.md') -Value ('# Existing user guidance'+[Environment]::NewLine+'Do not replace my rules.') -Encoding UTF8
          Set-Content -LiteralPath (Join-Path $testCodexHome 'config.toml') -Value "model = 'existing-model'" -Encoding UTF8
          Set-Content -LiteralPath (Join-Path $testCodexHome 'auth.json') -Value '{"test_marker":"NO_REAL_SECRETS"}' -Encoding UTF8
          $pins=@{}
          foreach($n in @('AGENTS.md','config.toml','auth.json')) { $pins[$n]=(Get-FileHash -LiteralPath (Join-Path $testCodexHome $n)).Hash }
          $planText=& powershell.exe -NoProfile -File $bootstrap -Action Plan -Client codex -CodexHome $testCodexHome -ManagedRoot $runtime
          if($LASTEXITCODE -ne 0){throw 'Preflight failed'}
          $plan=$planText | ConvertFrom-Json
          if($plan.installed -ne $false -or $plan.nodeSource -ne 'BUNDLED_PINNED' -or (Test-Path -LiteralPath $runtime)) { throw 'Preflight was not read only' }
          $installText=& powershell.exe -NoProfile -File $bootstrap -Action Install -Client codex -ApproveInstall -CodexHome $testCodexHome -ManagedRoot $runtime
          if($LASTEXITCODE -ne 0){throw 'Bootstrap install failed'}
          $installed=$installText | ConvertFrom-Json
          if(!$installed.installed -or $installed.connection -ne 'CONNECTED_FOR_NEW_SESSIONS'){throw 'Core not connected'}
          foreach($n in @('config.toml','auth.json')){if((Get-FileHash -LiteralPath (Join-Path $testCodexHome $n)).Hash -ne $pins[$n]){throw "User config changed: $n"}}
          $nodeInstalled=Join-Path $runtime 'node-v22.22.2\node.exe'
          $jh=Join-Path $testCodexHome 'j-harness-core\bin\jh.cmd'
          $doctorText=& $jh doctor
          if($LASTEXITCODE -ne 0){throw 'Installed launcher failed'}
          $doctor=$doctorText | ConvertFrom-Json
          if($doctor.effective -ne 'CONNECTED_FOR_NEW_SESSIONS' -or $doctor.backupStatus -ne 'MATCH'){throw 'Core doctor failed'}
          # Repeating first-time install must refuse to touch a running or installed Core.
          $originalErrorMode=$ErrorActionPreference
          try {
            $ErrorActionPreference='Continue'
            & powershell.exe -NoProfile -File $bootstrap -Action Install -Client codex -ApproveInstall -CodexHome $testCodexHome -ManagedRoot $runtime 1>$null 2>$null
            $duplicateExit=$LASTEXITCODE
          } finally { $ErrorActionPreference=$originalErrorMode }
          if($duplicateExit -eq 0){throw 'Second install incorrectly succeeded'}
          if((Get-FileHash -LiteralPath (Join-Path $testCodexHome 'config.toml')).Hash -ne $pins['config.toml']){throw 'Second install changed original configuration'}
          $uninstallText=& powershell.exe -NoProfile -File $remove -CodexHome $testCodexHome -ManagedRoot $runtime -ApproveUninstall
          if($LASTEXITCODE -ne 0){throw 'Uninstall rollback failed'}
          $uninstall=$uninstallText | ConvertFrom-Json
          if($uninstall.result -ne 'CORE_UNLINKED_ARCHIVED'){throw 'Unexpected uninstall result'}
          foreach($n in @('AGENTS.md','config.toml','auth.json')){if((Get-FileHash -LiteralPath (Join-Path $testCodexHome $n)).Hash -ne $pins[$n]){throw "Original bytes not restored: $n"}}
          if(!(Test-Path -LiteralPath $nodeInstalled)){throw 'Runtime cache unexpectedly removed'}
          # An unsigned distribution checksum is checked at Plan time; corrupted files fail closed.
          $catalog=Join-Path $package 'core\knowledge\categories.json'
          $clean=Join-Path $scratch 'categories.clean'
          Copy-Item -LiteralPath $catalog -Destination $clean
          try {
            Add-Content -LiteralPath $catalog -Value 'malicious-ci-byte'
            $originalErrorMode=$ErrorActionPreference
            try {
              $ErrorActionPreference='Continue'
              & powershell.exe -NoProfile -File $bootstrap -Action Plan -Client codex -CodexHome $testCodexHome -ManagedRoot $runtime 1>$null 2>$null
              $tamperExit=$LASTEXITCODE
            } finally { $ErrorActionPreference=$originalErrorMode }
            if($tamperExit -eq 0){throw 'Tampered package passed manifest verification'}
          } finally { Copy-Item -LiteralPath $clean -Destination $catalog -Force }
          # No approval: first-time install is not allowed even with bundled Node.
          $secondHome=Join-Path $scratch 'fresh-no-consent'
          New-Item -ItemType Directory -Path $secondHome -Force | Out-Null
          $originalErrorMode=$ErrorActionPreference
          try {
            $ErrorActionPreference='Continue'
            & powershell.exe -NoProfile -File $bootstrap -Action Install -Client codex -CodexHome $secondHome -ManagedRoot (Join-Path $scratch 'no-consent-managed') 1>$null 2>$null
            $noConsentExit=$LASTEXITCODE
          } finally { $ErrorActionPreference=$originalErrorMode }
          if($noConsentExit -eq 0 -or (Test-Path -LiteralPath (Join-Path $scratch 'no-consent-managed'))){throw 'Unapproved install created files'}
          # Run existing Core regression only after fake CLI setup in PATH; no real model calls.
          node --test core/tests/core.test.mjs core/tests/stability.test.mjs
          if($LASTEXITCODE -ne 0){throw 'Existing Core regression failed'}
          Write-Output 'PASS: pinned Node; simulated Codex; install+doctor; exact uninstall; duplicate/consent/tamper rejection; Core regressions'
      - name: Pack unsigned portable installer ZIP
        shell: pwsh
        run: |
          $dist=Join-Path $env:RUNNER_TEMP 'jh-phase2-dist'
          Compress-Archive -Path (Join-Path $dist '*') -DestinationPath (Join-Path $env:RUNNER_TEMP 'J_Harness_Phase2_Unsigned_Windows_Candidate.zip') -CompressionLevel Optimal
      - uses: actions/upload-artifact@v4
        with:
          name: J-Harness-Phase2-Unsigned-NotForProduction
          path: ${{ runner.temp }}\J_Harness_Phase2_Unsigned_Windows_Candidate.zip
          retention-days: 14
